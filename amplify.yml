# Amplify Hosting build for the static frontend only (no Amplify backend: see .kiro/steering/voltlot-rules.md §2).
# The backend is the CDK app in infra/. config.json points the site at it and is written from the app's
# environment variables (DWELL_API_URL, DWELL_REGION, DWELL_USER_POOL_ID, DWELL_USER_POOL_CLIENT_ID).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 needs Node 22.12 or newer.
        - nvm install 22
        - nvm use 22
        - node --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run backend:config -- --from-env
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
